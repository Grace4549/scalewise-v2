kind = "web"
previewPath = "/"
title = "ScaleWise"
version = "1.0.0"
id = "artifacts/scalewise"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18082

[services.development]
run = "pnpm --filter @workspace/scalewise run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scalewise", "run", "build" ]
publicDir = "artifacts/scalewise/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18082"
BASE_PATH = "/"
