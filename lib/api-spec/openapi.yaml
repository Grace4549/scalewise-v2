      required: [expert, upcomingBookings, completedBookings, cancelledWithEarnings, totalEarnings, commissionPaid, cancellationEarnings, netEarnings, pendingPayout]
      properties:
        expert:
          $ref: "#/components/schemas/Expert"
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        completedBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        cancelledWithEarnings:
          type: array
          items:
            type: object
            additionalProperties: true
        totalEarnings:
          type: number
        commissionPaid:
          type: number
        cancellationEarnings:
          type: number
        netEarnings:
          type: number
        pendingPayout:
          type: number
