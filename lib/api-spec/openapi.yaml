openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScaleWise API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: experts
    description: Expert profiles
  - name: bookings
    description: Session bookings
  - name: reviews
    description: Public reviews
  - name: messages
    description: Messaging
  - name: admin
    description: Admin operations
  - name: launch
    description: Pre-launch notification capture
paths:
  /launch/subscribe:
    post:
      operationId: subscribeLaunchNotification
      tags: [launch]
      summary: Subscribe to launch notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchSubscribeInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchNotification"
        "400":
          description: Invalid email
        "409":
          description: Already subscribed

  /admin/launch-notifications:
    get:
      operationId: listLaunchNotifications
      tags: [launch]
      summary: List all launch notification subscribers (admin only)
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaunchNotification"
        "403":
          description: Forbidden

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /experts:
    get:
      operationId: listExperts
      tags: [experts]
      summary: List approved experts
      parameters:
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
            maximum: 50
      responses:
        "200":
          description: List of experts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertList"

  /experts/{id}:
    get:
      operationId: getExpert
      tags: [experts]
      summary: Get expert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expert profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"
        "404":
          description: Not found

  /experts/apply:
    post:
      operationId: applyAsExpert
      tags: [experts]
      summary: Submit expert application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"
        "400":
          description: Bad request

  /experts/industries:
    get:
      operationId: listIndustries
      tags: [experts]
      summary: List all industries
      responses:
        "200":
          description: Industries list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/search-suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [experts]
      summary: Autocomplete search suggestions
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/stats:
    get:
      operationId: getPlatformStats
      tags: [experts]
      summary: Platform statistics (public)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings for current user
      responses:
        "200":
          description: My bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /bookings/{id}/reschedule:
    patch:
      operationId: rescheduleBooking
      tags: [bookings]
      summary: Reschedule a booking (client, expert, or admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingReschedule"
      responses:
        "200":
          description: Rescheduled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Time slot conflict

  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (expert or admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all public reviews
      parameters:
        - in: query
          name: expertId
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a public review (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/verified:
    post:
      operationId: createVerifiedReview
      tags: [reviews]
      summary: Submit a verified review (must be logged in with a completed booking for that expert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiedReviewInput"
      responses:
        "201":
          description: Verified review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: No completed booking found
        "401":
          description: Not authenticated

  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /messages/{bookingId}:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a booking thread
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a booking thread
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/admin/{expertId}:
    get:
      operationId: listAdminMessages
      tags: [messages]
      summary: List admin-to-expert direct messages
      parameters:
        - in: path
          name: expertId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admin messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendAdminMessage
      tags: [messages]
      summary: Send admin-to-expert direct message
      parameters:
        - in: path
          name: expertId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/inbox:
    get:
      operationId: getInbox
      tags: [messages]
      summary: Get all inbox threads for the current user
      responses:
        "200":
          description: Inbox threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxThread"

  /admin/applications:
    get:
      operationId: listApplications
      tags: [admin]
      summary: List all expert applications (admin only)
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [admin]
      summary: Approve an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [admin]
      summary: Reject an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/bookings:
    get:
      operationId: listAllBookings
      tags: [admin]
      summary: List all bookings (admin only) with optional filters
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_payment, upcoming, completed, cancelled, no-show]
        - in: query
          name: expertId
          schema:
            type: integer
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: All bookings with commission info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/status:
    patch:
      operationId: adminUpdateBookingStatus
      tags: [admin]
      summary: Admin force-update a booking status (cancel or no-show)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/mark-refund-paid:
    post:
      operationId: markRefundPaid
      tags: [admin]
      summary: Mark a booking's client refund as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refund marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/mark-paid:
    post:
      operationId: markBookingPaid
      tags: [admin]
      summary: Mark a completed booking's payout as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking payout marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/experts/breakdown:
    get:
      operationId: getExpertBreakdown
      tags: [admin]
      summary: Per-expert earnings and payout breakdown (admin only)
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: Expert breakdown list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminExpertBreakdown"

  /admin/experts/{id}/mark-paid:
    post:
      operationId: markExpertPaid
      tags: [admin]
      summary: Mark all pending payout bookings for an expert as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkExpertPaidInput"
      responses:
        "200":
          description: Payouts marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkExpertPaidResult"

  /expert/dashboard:
    get:
      operationId: getExpertDashboard
      tags: [experts]
      summary: Get expert dashboard data (expert only)
      responses:
        "200":
          description: Expert dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertDashboard"

  /expert/profile:
    patch:
      operationId: updateExpertProfile
      tags: [experts]
      summary: Update own expert profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [client, expert, admin]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        createdAt:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [client, expert]
        inviteToken:
          type: string
          description: One-time invite token required when registering with role=expert

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Expert:
      type: object
      required: [id, name, headline, industry, yearsExperience, rating, totalSessions, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        headline:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        rating:
          type: number
        totalSessions:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string

    ExpertList:
      type: object
      required: [experts, total, page, limit]
      properties:
        experts:
          type: array
          items:
            $ref: "#/components/schemas/Expert"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ExpertProfile:
      type: object
      required: [id, name, headline, industry, yearsExperience, rating, totalSessions, status, createdAt, reviews, verifiedReviews]
      properties:
        id:
          type: integer
        name:
          type: string
        headline:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        rating:
          type: number
        totalSessions:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        verifiedReviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"

    ExpertApplicationInput:
      type: object
      required: [name, email, industry, yearsExperience]
      properties:
        name:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 254
        industry:
          type: string
          maxLength: 100
        yearsExperience:
          type: integer
        headline:
          type: string
          maxLength: 200
        bio:
          type: string
          maxLength: 3000
        skills:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 100
        companyName:
          type: string
          maxLength: 200
        linkedinUrl:
          type: string
          maxLength: 500
        socialMediaUrl:
          type: string
          maxLength: 500
        discoveryPrice:
          type: number
        consultancyPrice:
          type: number
        growthPrice3mo:
          type: number
        growthPrice6mo:
          type: number

    ExpertApplication:
      type: object
      required: [id, name, email, industry, yearsExperience, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        headline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        userId:
          type: ["integer", "null"]
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string

    ExpertProfileUpdate:
      type: object
      properties:
        headline:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        discoveryPrice:
          type: number
        consultancyPrice:
          type: number
        growthPrice3mo:
          type: number
        growthPrice6mo:
          type: number

    Booking:
      type: object
      required: [id, clientId, expertId, sessionType, scheduledTime, durationMinutes, status, payoutStatus, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        expertId:
          type: integer
        sessionType:
          type: string
          enum: [discovery, consultancy, growth_3mo, growth_6mo]
        scheduledTime:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [pending_payment, upcoming, completed, cancelled, no-show]
        payoutStatus:
          type: string
          enum: [pending, paid]
        payoutPaidAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        meetLink:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        clientName:
          type: ["string", "null"]
        expertName:
          type: ["string", "null"]
        expertIndustry:
          type: ["string", "null"]
        createdAt:
          type: string
        cancelledBy:
          type: ["string", "null"]
        cancellationReason:
          type: ["string", "null"]
        refundStatus:
          type: string
          enum: [none, pending, paid]
        refundAmount:
          type: ["number", "null"]
        refundPercent:
          type: ["number", "null"]
        expertCancellationEarning:
          type: ["number", "null"]
        rescheduledBy:
          type: ["string", "null"]
        rescheduledFromTime:
          type: ["string", "null"]
        rescheduledAt:
          type: ["string", "null"]

    BookingInput:
      type: object
      required: [expertId, sessionType, scheduledTime]
      properties:
        expertId:
          type: integer
        sessionType:
          type: string
