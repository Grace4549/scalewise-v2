openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GrowPia API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: experts
    description: Expert profiles
  - name: bookings
    description: Session bookings
  - name: reviews
    description: Public reviews
  - name: messages
    description: Messaging
  - name: admin
    description: Admin operations
  - name: launch
    description: Pre-launch notification capture
paths:
  /launch/subscribe:
    post:
      operationId: subscribeLaunchNotification
      tags: [launch]
      summary: Subscribe to launch notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LaunchSubscribeInput"
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaunchNotification"
        "400":
          description: Invalid email
        "409":
          description: Already subscribed

  /admin/launch-notifications:
    get:
      operationId: listLaunchNotifications
      tags: [launch]
      summary: List all launch notification subscribers (admin only)
      responses:
        "200":
          description: List of subscribers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LaunchNotification"
        "403":
          description: Forbidden

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created — verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPending"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email address using token from verification email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified — user is now logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid token
        "410":
          description: Token expired

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend the email verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Verification email queued

  /experts:
    get:
      operationId: listExperts
      tags: [experts]
      summary: List approved experts
      parameters:
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
            maximum: 50
      responses:
        "200":
          description: List of experts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertList"

  /experts/{id}:
    get:
      operationId: getExpert
      tags: [experts]
      summary: Get expert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expert profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"
        "404":
          description: Not found

  /experts/apply:
    post:
      operationId: applyAsExpert
      tags: [experts]
      summary: Submit expert application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"
        "400":
          description: Bad request

  /experts/industries:
    get:
      operationId: listIndustries
      tags: [experts]
      summary: List all industries
      responses:
        "200":
          description: Industries list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/search-suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [experts]
      summary: Autocomplete search suggestions
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/stats:
    get:
      operationId: getPlatformStats
      tags: [experts]
      summary: Platform statistics (public)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /experts/{id}/availability:
    get:
      operationId: getExpertAvailability
      tags: [experts]
      summary: List available time slots for an expert (public)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /expert/availability:
    get:
      operationId: listMyAvailability
      tags: [experts]
      summary: List expert's own availability slots (expert only)
      security:
        - sessionAuth: []
      responses:
        "200":
          description: All my availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
    post:
      operationId: addAvailabilitySlot
      tags: [experts]
      summary: Add an availability slot (expert only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilitySlotInput"
      responses:
        "201":
          description: Created slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySlot"

  /expert/availability/bulk:
    put:
      operationId: replaceWeekAvailability
      tags: [experts]
      summary: Atomically replace all slots for a specific week (expert only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityBulkSet"
      responses:
        "200":
          description: Count of new slots created
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer

  /expert/availability/{id}:
    delete:
      operationId: deleteAvailabilitySlot
      tags: [experts]
      summary: Delete an availability slot (expert only)
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings for current user
      responses:
        "200":
          description: My bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /bookings/{id}/reschedule:
    patch:
      operationId: rescheduleBooking
      tags: [bookings]
      summary: Reschedule a booking (client, expert, or admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingReschedule"
      responses:
        "200":
          description: Rescheduled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "409":
          description: Time slot conflict

  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (expert or admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/expert-cancel:
    post:
      operationId: expertCancelBooking
      tags: [bookings]
      summary: Expert cancels a booking (always triggers full refund to client)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertCancelInput"
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/acknowledge:
    post:
      operationId: acknowledgeBooking
      tags: [bookings]
      summary: Expert acknowledges an incoming booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/request-reschedule:
    post:
      operationId: requestReschedule
      tags: [bookings]
      summary: Expert requests client to reschedule (no cancellation, no refund)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequestInput"
      responses:
        "200":
          description: Reschedule request sent
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /bookings/{id}/keep-original:
    post:
      operationId: keepOriginalTime
      tags: [bookings]
      summary: Client declines expert's reschedule request and keeps the original booking time
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expert notified
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for the authenticated user (newest first)
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/seen:
    patch:
      operationId: markNotificationSeen
      tags: [notifications]
      summary: Mark a notification as seen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all public reviews
      parameters:
        - in: query
          name: expertId
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a public review (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/verified:
    post:
      operationId: createVerifiedReview
      tags: [reviews]
      summary: Submit a verified review (must be logged in with a completed booking for that expert)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifiedReviewInput"
      responses:
        "201":
          description: Verified review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: No completed booking found
        "401":
          description: Not authenticated

  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /messages/{bookingId}:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a booking thread
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a booking thread
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{bookingId}/mark-read:
    post:
      operationId: markThreadRead
      tags: [messages]
      summary: Mark all messages in a booking thread as read for the current user
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked as read

  /messages/admin/{expertId}:
    get:
      operationId: listAdminMessages
      tags: [messages]
      summary: List admin-to-expert direct messages
      parameters:
        - in: path
          name: expertId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admin messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendAdminMessage
      tags: [messages]
      summary: Send admin-to-expert direct message
      parameters:
        - in: path
          name: expertId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/inbox:
    get:
      operationId: getInbox
      tags: [messages]
      summary: Get all inbox threads for the current user
      responses:
        "200":
          description: Inbox threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InboxThread"

  /admin/conversations:
    get:
      operationId: listAdminConversations
      tags: [admin]
      summary: List all client-expert conversation threads (admin only)
      responses:
        "200":
          description: All booking message threads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConversation"
        "403":
          description: Forbidden

  /admin/applications:
    get:
      operationId: listApplications
      tags: [admin]
      summary: List all expert applications (admin only)
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [admin]
      summary: Approve an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [admin]
      summary: Reject an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/bookings:
    get:
      operationId: listAllBookings
      tags: [admin]
      summary: List all bookings (admin only) with optional filters
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending_payment, upcoming, completed, cancelled, no-show]
        - in: query
          name: expertId
          schema:
            type: integer
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: All bookings with commission info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/status:
    patch:
      operationId: adminUpdateBookingStatus
      tags: [admin]
      summary: Admin force-update a booking status (cancel or no-show)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/mark-refund-paid:
    post:
      operationId: markRefundPaid
      tags: [admin]
      summary: Mark a booking's client refund as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refund marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/bookings/{id}/mark-paid:
    post:
      operationId: markBookingPaid
      tags: [admin]
      summary: Mark a completed booking's payout as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking payout marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBooking"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/experts/breakdown:
    get:
      operationId: getExpertBreakdown
      tags: [admin]
      summary: Per-expert earnings and payout breakdown (admin only)
      parameters:
        - in: query
          name: dateFrom
          schema:
            type: string
        - in: query
          name: dateTo
          schema:
            type: string
      responses:
        "200":
          description: Expert breakdown list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminExpertBreakdown"

  /client/receipts:
    get:
      operationId: listClientReceipts
      tags: [bookings]
      summary: List all receipts for the current client (booking payments + refunds)
      responses:
        "200":
          description: Client receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientReceiptSummary"

  /client/receipts/booking/{bookingId}:
    get:
      operationId: getClientBookingReceipt
      tags: [bookings]
      summary: Get booking payment receipt for a specific booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientBookingReceipt"

  /client/receipts/refund/{bookingId}:
    get:
      operationId: getClientRefundReceipt
      tags: [bookings]
      summary: Get refund receipt for a specific booking (only available after refund is paid)
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Refund receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientRefundReceipt"

  /expert/receipts:
    get:
      operationId: listExpertReceipts
      tags: [experts]
      summary: List all payout batch receipts for the current expert
      responses:
        "200":
          description: Expert payout receipt list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpertReceiptSummary"

  /expert/receipts/payout/{batchId}:
    get:
      operationId: getExpertPayoutReceipt
      tags: [experts]
      summary: Get detailed expert payout receipt for a batch
      parameters:
        - in: path
          name: batchId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expert payout receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertPayoutReceipt"

  /admin/receipts:
    get:
      operationId: listAdminReceipts
      tags: [admin]
      summary: List all receipts (payout batches + refunds) for admin
      responses:
        "200":
          description: Admin receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReceiptsList"

  /admin/experts/{id}/payout:
    post:
      operationId: createExpertPayout
      tags: [admin]
      summary: Create a payout batch for an expert (admin only) — marks session bookings paid and generates receipt
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutInput"
      responses:
        "200":
          description: Payout batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePayoutResult"

  /admin/experts/{id}/mark-paid:
    post:
      operationId: markExpertPaid
      tags: [admin]
      summary: Mark all pending payout bookings for an expert as paid (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkExpertPaidInput"
      responses:
        "200":
          description: Payouts marked as paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkExpertPaidResult"

  /expert/dashboard:
    get:
      operationId: getExpertDashboard
      tags: [experts]
      summary: Get expert dashboard data (expert only)
      responses:
        "200":
          description: Expert dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertDashboard"

  /expert/settings:
    get:
      operationId: getExpertSettings
      tags: [experts]
      summary: Get own availability settings (expert only)
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertSettings"
    patch:
      operationId: updateExpertSettings
      tags: [experts]
      summary: Update availability settings (expert only)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertSettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertSettings"

  /expert/profile:
    patch:
      operationId: updateExpertProfile
      tags: [experts]
      summary: Update own expert profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"

