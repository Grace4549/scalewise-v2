openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ScaleWise API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: experts
    description: Expert profiles
  - name: bookings
    description: Session bookings
  - name: reviews
    description: Public reviews
  - name: messages
    description: Messaging
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /experts:
    get:
      operationId: listExperts
      tags: [experts]
      summary: List approved experts
      parameters:
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: List of experts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertList"

  /experts/{id}:
    get:
      operationId: getExpert
      tags: [experts]
      summary: Get expert by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Expert profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"
        "404":
          description: Not found

  /experts/apply:
    post:
      operationId: applyAsExpert
      tags: [experts]
      summary: Submit expert application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"
        "400":
          description: Bad request

  /experts/industries:
    get:
      operationId: listIndustries
      tags: [experts]
      summary: List all industries
      responses:
        "200":
          description: Industries list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/search-suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [experts]
      summary: Autocomplete search suggestions
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /experts/stats:
    get:
      operationId: getPlatformStats
      tags: [experts]
      summary: Platform statistics (public)
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /bookings:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings for current user
      responses:
        "200":
          description: My bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found

  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (expert or admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List all public reviews
      parameters:
        - in: query
          name: expertId
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a public review (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{id}:
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /messages/{bookingId}:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages for a booking
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a booking thread
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /admin/applications:
    get:
      operationId: listApplications
      tags: [admin]
      summary: List all expert applications (admin only)
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/approve:
    post:
      operationId: approveApplication
      tags: [admin]
      summary: Approve an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/applications/{id}/reject:
    post:
      operationId: rejectApplication
      tags: [admin]
      summary: Reject an expert application (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertApplication"

  /admin/bookings:
    get:
      operationId: listAllBookings
      tags: [admin]
      summary: List all bookings (admin only)
      responses:
        "200":
          description: All bookings with commission info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBooking"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /expert/dashboard:
    get:
      operationId: getExpertDashboard
      tags: [experts]
      summary: Get expert dashboard data (expert only)
      responses:
        "200":
          description: Expert dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertDashboard"

  /expert/profile:
    patch:
      operationId: updateExpertProfile
      tags: [experts]
      summary: Update own expert profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpertProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertProfile"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [client, expert, admin]
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        createdAt:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        name:
          type: string
        role:
          type: string
          enum: [client, expert]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    Expert:
      type: object
      required: [id, userId, name, headline, industry, yearsExperience, rating, totalSessions, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        headline:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        rating:
          type: number
        totalSessions:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string

    ExpertList:
      type: object
      required: [experts, total, page, limit]
      properties:
        experts:
          type: array
          items:
            $ref: "#/components/schemas/Expert"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ExpertProfile:
      type: object
      required: [id, userId, name, headline, industry, yearsExperience, rating, totalSessions, status, createdAt, reviews]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        headline:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        rating:
          type: number
        totalSessions:
          type: integer
        avatarUrl:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"

    ExpertApplicationInput:
      type: object
      required: [name, email, industry, yearsExperience]
      properties:
        name:
          type: string
        email:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        headline:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        discoveryPrice:
          type: number
        consultancyPrice:
          type: number
        growthPrice3mo:
          type: number
        growthPrice6mo:
          type: number

    ExpertApplication:
      type: object
      required: [id, name, email, industry, yearsExperience, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        industry:
          type: string
        yearsExperience:
          type: integer
        headline:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        discoveryPrice:
          type: ["number", "null"]
        consultancyPrice:
          type: ["number", "null"]
        growthPrice3mo:
          type: ["number", "null"]
        growthPrice6mo:
          type: ["number", "null"]
        createdAt:
          type: string

    ExpertProfileUpdate:
      type: object
      properties:
        headline:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: string
        discoveryPrice:
          type: number
        consultancyPrice:
          type: number
        growthPrice3mo:
          type: number
        growthPrice6mo:
          type: number

    Booking:
      type: object
      required: [id, clientId, expertId, sessionType, scheduledTime, durationMinutes, status, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        expertId:
          type: integer
        sessionType:
          type: string
          enum: [discovery, consultancy, growth_3mo, growth_6mo]
        scheduledTime:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [pending, approved, completed, cancelled]
        notes:
          type: ["string", "null"]
        meetLink:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        clientName:
          type: ["string", "null"]
        expertName:
          type: ["string", "null"]
        expertIndustry:
          type: ["string", "null"]
        createdAt:
          type: string

    BookingInput:
      type: object
      required: [expertId, sessionType, scheduledTime, durationMinutes]
      properties:
        expertId:
          type: integer
        sessionType:
          type: string
          enum: [discovery, consultancy, growth_3mo, growth_6mo]
        scheduledTime:
          type: string
        durationMinutes:
          type: integer
        notes:
          type: string

    BookingStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, completed, cancelled]

    AdminBooking:
      type: object
      required: [id, clientId, expertId, sessionType, scheduledTime, durationMinutes, status, amount, commission, createdAt]
      properties:
        id:
          type: integer
        clientId:
          type: integer
        expertId:
          type: integer
        sessionType:
          type: string
        scheduledTime:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
        notes:
          type: ["string", "null"]
        meetLink:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]
        commission:
          type: ["number", "null"]
        commissionRate:
          type: ["number", "null"]
        clientName:
          type: ["string", "null"]
        expertName:
          type: ["string", "null"]
        createdAt:
          type: string

    Review:
      type: object
      required: [id, reviewerName, rating, body, createdAt]
      properties:
        id:
          type: integer
        reviewerName:
          type: string
        businessName:
          type: ["string", "null"]
        expertId:
          type: ["integer", "null"]
        rating:
          type: integer
        body:
          type: string
        createdAt:
          type: string

    ReviewInput:
      type: object
      required: [reviewerName, rating, body]
      properties:
        reviewerName:
          type: string
        businessName:
          type: string
        expertId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        body:
          type: string

    Message:
      type: object
      required: [id, bookingId, senderId, body, createdAt]
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        senderId:
          type: integer
        senderName:
          type: string
        senderRole:
          type: string
        body:
          type: string
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string

    PlatformStats:
      type: object
      required: [expertCount, industryCount, sessionCount, reviewCount]
      properties:
        expertCount:
          type: integer
        industryCount:
          type: integer
        sessionCount:
          type: integer
        reviewCount:
          type: integer

    AdminStats:
      type: object
      required: [totalExperts, pendingApplications, totalBookings, totalRevenue, totalCommission, recentBookings]
      properties:
        totalExperts:
          type: integer
        pendingApplications:
          type: integer
        totalBookings:
          type: integer
        totalRevenue:
          type: number
        totalCommission:
          type: number
        recentBookings:
          type: array
          items:
            $ref: "#/components/schemas/AdminBooking"

    ExpertDashboard:
      type: object
      required: [expert, upcomingBookings, pendingRequests, totalEarnings, commissionPaid, netEarnings]
      properties:
        expert:
          $ref: "#/components/schemas/Expert"
        upcomingBookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        pendingRequests:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        totalEarnings:
          type: number
        commissionPaid:
          type: number
        netEarnings:
          type: number
